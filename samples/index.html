<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paperwise sample documents</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#6e6e73;--accent:#0a7a88}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#f5f5f7;--muted:#a1a1a6;--accent:#41c4c1}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:20px}
figure{margin:0}img{width:100%;border-radius:10px;display:block}
figcaption{font-size:.9rem;margin-top:6px}a{color:var(--accent)}
</style></head><body><main>
<h1>Paperwise sample documents</h1>
<p>Made-up documents for trying Paperwise. On iPhone, open an image, tap Share › Save Image, then in Paperwise tap <b>Photos</b>. Or tap <b>Files › Import from Files</b>. You can also show an image on another screen and scan it with <b>Scan</b>.</p>
<div class="grid">
<figure><a href="curled-letter.jpg"><img src="curled-letter.jpg" alt="Curled school letter"></a><figcaption><b>Curled letter</b>: turn on Flatten to straighten the lines.</figcaption></figure>
<figure><a href="invoice-with-due-date.jpg"><img src="invoice-with-due-date.jpg" alt="Invoice with due date"></a><figcaption><b>Invoice</b>: auto-named, with a "Remind Me" for the due date.</figcaption></figure>
<figure><a href="receipt.jpg"><img src="receipt.jpg" alt="Grocery receipt"></a><figcaption><b>Receipt</b>: named "Receipt – Freshco Market – $30.70".</figcaption></figure>
<figure><a href="id-card.jpg"><img src="id-card.jpg" alt="Sample ID card"></a><figcaption><b>ID card</b>: use ID Card mode for front and back on one page.</figcaption></figure>
</div>
<p><a href="../">Privacy policy</a></p>
</main></body></html>
